[project]
name = "autonomous-software-company"
version = "0.4.0"
description = "A company where AI agents run all operations and a human only sets direction."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E501",   # long lines (prompts, schemas) are intentional
    "UP042",  # str+Enum is deliberate — JSON serialization relies on .value
]

[tool.pytest.ini_options]
testpaths = ["tests"]
